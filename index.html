<script>
    const ACCOUNTS = [
        { name: "KhoiND 01", api: "https://dev.ipadl1.workers.dev", ghRepo: "user/repo-1" },
        { name: "KhoiND 02", api: "https://dev.ipadl2.workers.dev", ghRepo: "user/repo-2" }
    ];

    async function loadData(idx) {
        const acc = ACCOUNTS[idx];
        try {
            // Lấy dung lượng từ Worker (R2)
            const s = await (await fetch(`${acc.api}/storage`, {headers:{"Authorization":PASS}})).json();
            document.getElementById(`st-txt-${idx}`).innerText = (s.usedBytes/1024/1024).toFixed(1) + " MB";

            // Lấy danh sách App từ GitHub API
            const res = await fetch(`https://api.github.com/repos/${acc.ghRepo}/contents/apps`);
            const files = await res.json();
            let html = "";
            
            for(let f of files) {
                if(f.name.endsWith('.json')) {
                    const meta = await (await fetch(f.download_url)).json();
                    html += `
                    <div class="app-item">
                        <img src="${meta.icon}" class="app-icon">
                        <b>${meta.name}</b>
                        <button onclick="delApp(${idx}, '${meta.id}', '${meta.fileName}')">XOÁ</button>
                    </div>`;
                }
            }
            document.getElementById(`list-${idx}`).innerHTML = html;
        } catch(e) { console.log("Lỗi load tài khoản này"); }
    }

    async function delApp(idx, id, fileName) {
        if(confirm("Xoá sạch trên cả R2 và GitHub?")) {
            const acc = ACCOUNTS[idx];
            await fetch(`${acc.api}/delete?id=${id}&file=${fileName}`, {
                method: 'DELETE',
                headers: { "Authorization": PASS }
            });
            loadData(idx); // Load lại danh sách
        }
    }
</script>
